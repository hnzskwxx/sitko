<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sítko je offline</title>
<style>
  :root { --bg: #F7F7F5; --text: #191919; --text-2: #6B6B67; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --text: #EDEDEA; --text-2: #A1A19C; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
  main { max-width: 360px; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--text-2); }
  a { color: var(--text); }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" width="40" height="40" alt="">
  <h1>Nejste připojeni k internetu</h1>
  <p>Sítko potřebuje připojení, aby zobrazilo aktuální kandidáty. Jakmile se připojíte, <a href="/">načtěte stránku znovu</a>.</p>
</main>
</body>
</html>
